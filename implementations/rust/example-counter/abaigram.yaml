# abaigram.yaml: the manifest of example-counter as an abaigram (abaigrammar 0.1).
# Generated by `cargo run -q -p example-counter -- abai manifest` from the program's declarations in code.
# Do not edit by hand: `cargo run -q -p example-counter -- abai doctor` checks that this file agrees with the code.
# Regenerate with `cargo run -q -p example-counter -- abai manifest > abaigram.yaml`.

abaigrammar: "0.1"
name: example-counter
entry: cargo run -q -p example-counter -- abai
modes:
  - turns
  - thread
  - sidecar
check:
  run: cargo run -q -p example-counter
content:
  identity: abai/identity.md
  use: abai/use.md
audit:
  path: ~/.abai/audit/example-counter.jsonl
lifecycle:
  pause: cooperative
  stop:
    graceful: "5s"
    handler: stop
deviations:
  - "The null harness (ABAI_HARNESS=null and exercise) stays in the program's process in every mode and has no thread of its own: no endpoint opens under sidecar mode, it works on the program's thread inside attach(), touchpoints and safepoints, and it reads events only then, so a check measures neither the socket nor a harness thread, and events that lap the ring between those moments are reported as dropped (section 11.6)."
  - "In thread mode a panic on the harness thread is caught and the program runs on as itself; a program built with panic = \"abort\" has no such isolation and must not declare thread mode (section 6.2)."
  - Under launch the program is attached when it builds its declarations, the first thing in main(), not before main() (section 6.3).
cells:
  - name: count
    type: int
    access: read
    doc: How far the counter has got.
  - name: step
    type: int
    access: readwrite
    doc: How much each tick adds.
    range:
      - 1
      - 100
    default: 1
    cadence: 1000
    policy: auto
  - name: label
    type: string
    access: readwrite
    doc: The word printed beside the count.
    max: 64
    default: count
    policy: auto
    timeout: "30s"
events:
  - name: milestone
    doc: The count passed a multiple of one hundred.
    payload:
      count: int
      label:
        type: string
        max: 64
    wakes: always
capabilities:
  - name: reset
    doc: Set the count back to a value.
    params:
      to: int
    result:
      was: int
    effect: mutate
    dispatch: safepoint
    timeout: "30s"
    policy: confirm
    example:
      to: 0
decisions:
  - name: on_limit
    doc: Asked when the count reaches its limit.
    context:
      count: int
    options:
      - wrap
      - stop
    default: stop
    timeout: "5s"
    policy: auto
turns:
  - name: every_thousand
    doc: After each thousand ticks.
    timeout: "30s"
