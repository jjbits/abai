[package]
name = "abaikit"
description = "The authoring tool for Rust abaigrams: check verifies a program's conformance level with no model, learnabai prints the guide for a coding agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The npm package of the TypeScript implementation installs `abaikit`;
# this one is `abaikit-rs`, so both can be on one PATH.
[[bin]]
name = "abaikit-rs"
path = "src/main.rs"

[dependencies]
abai-stub = { path = "../abai-stub", version = "0.1.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
