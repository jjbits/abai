# abaigram.yaml: the manifest of abaikit as an abaigram (abaigrammar 0.1).
# Generated by `abaikit abai manifest` from the program's declarations in code.
# Do not edit by hand: `abaikit abai doctor` and the test suite check that this file
# agrees with the code. Regenerate with `abaikit abai manifest > abaigram.yaml`.

abaigrammar: "0.1"
name: abaikit
entry: abaikit abai
modes:
  - turns
  - sidecar
check:
  run: node dist/bin.js check examples/hello
content:
  identity: abai/identity.md
  use: abai/use.md
audit:
  path: ~/.abai/audit/abaikit.jsonl
deviations:
  - "Touchpoints are awaited promises: Node cannot block its only thread while the agent loop runs on it, so the program's logic pauses at the await while its own timers and I/O callbacks keep running (section 4.3)."
  - "Sized cell writes and event payload copies allocate: JavaScript has no copy into a preallocated byte slot; scalar rows meet section 11.2, sized rows are measured and reported."
  - "A cooperative pause holds the program at its next touchpoint, not inside safepoint(): a safepoint cannot block, since the resume arrives on the same event loop that would be blocked. The flag is still one load at a safepoint, and os pause (the launcher's signal) holds the program anywhere (section 5.5)."
  - "Under launch the child is attached as soon as its endpoint is accepted, a moment after its first statement rather than before it: Node cannot listen in a constructor. A program that wants the agent present from its first line awaits attach() (section 6.3)."
  - "In sidecar mode the region is not shared memory: cells are read by request and events cross the socket, so observation costs the program one serialization per connected harness (section 11.3). Under ABAI_HARNESS=null or exercise the null harness stays in the program's process and no endpoint opens, so a check run's measured overhead leaves that serialization out."
cells:
  - name: check.runs
    type: int
    access: read
    doc: Conformance checks run by this process.
  - name: check.last_level
    type: int
    access: read
    doc: The level the last check reported, 0 to 4.
  - name: abaify.max_rounds
    type: int
    access: readwrite
    default: 5
    range:
      - 1
      - 20
    doc: Agent rounds abaify gives a retrofit before it stops.
    policy: auto
events:
  - name: check.completed
    payload:
      repo:
        type: string
        max: 512
      level:
        type: int
    wakes: never
    doc: A conformance check finished.
  - name: repo.changed
    payload:
      path:
        type: string
        max: 512
      how:
        type: string
        max: 32
    wakes: never
    doc: "abaify changed the repository: wrote a file, inserted lines, added a dependency, regenerated the manifest, or installed."
capabilities:
  - name: learnabai
    params:
      section: string
    result:
      text: string
    dispatch: immediate
    effect: read
    example: {}
    doc: "The guide for an agent: what an abaigram is, how to declare one in TypeScript, how to retrofit a repository, how check judges it; one section or all."
    timeout: 30s
    policy: auto
  - name: check
    params:
      repo: string
      level: int
      mode: string
      entry: string
      runs: int
    result:
      level: int
      passed: bool
      report: string
    dispatch: immediate
    effect: mutate
    policy: auto
    timeout: 1800s
    example:
      repo: examples/hello
    doc: "Verify a repository's conformance (section 12): L1 through its entry, L2 to L4 by running the repository's check.run command under the null harness, an exercise run and the measurement runs per mode. Needs no model; may take minutes."
  - name: new
    params:
      name: string
      lang: string
      level: int
      dir: string
    result:
      path: string
      written: int
    dispatch: immediate
    effect: mutate
    policy: confirm
    doc: Create a fresh abaigram in a language, at a level, with one example of each declaration and the content slots in place.
    timeout: 30s
  - name: repo.list
    params:
      repo: string
      glob: string
    result:
      count: int
      listing: string
    dispatch: immediate
    effect: read
    example:
      repo: examples/hello
    doc: "List a repository's files, skipping dependencies, build output and ignored trees; bounded, and the bound is said first. glob narrows: *.json by name anywhere, src/** or scripts/*.mjs by path."
    timeout: 30s
    policy: auto
  - name: repo.read
    params:
      repo: string
      path: string
      start: int
      lines: int
    result:
      text: string
      total_lines: int
      from: int
      to: int
    dispatch: immediate
    effect: read
    example:
      repo: examples/hello
      path: abaigram.yaml
    doc: "Read part of a file in a repository: a window from line start, 400 lines or 12 KB at most a call; the result says from and to."
    timeout: 30s
    policy: auto
  - name: repo.write
    params:
      repo: string
      path: string
      content: string
      why: string
    result:
      written: bool
    dispatch: immediate
    effect: mutate
    policy: confirm
    doc: Write a new file in a repository (any directory this process can reach; under an MCP client each call is the client's permission prompt); an existing file is refused, since abaify adds and never replaces.
    timeout: 30s
  - name: repo.insert
    params:
      repo: string
      path: string
      anchor: string
      where: string
      text: string
      why: string
    result:
      line: int
    dispatch: immediate
    effect: mutate
    policy: confirm
    doc: Insert text before or after a unique anchor line in an existing file of a repository; no line the file had is removed or reordered.
    timeout: 30s
  - name: repo.add_dependency
    params:
      repo: string
      name: string
      spec: string
      why: string
    result:
      spec: string
    dispatch: immediate
    effect: mutate
    policy: confirm
    doc: Add a dependency to the repository's package.json in sorted place (the file is re-serialized, keys and indentation kept); the spec defaults to how abaikit reaches @abaigram/abai-stub, @abaigram/abai-embedded-harness and @abaigram/abaikit.
    timeout: 30s
  - name: repo.manifest
    params:
      repo: string
      entry: string
      why: string
    result:
      written: bool
      lines: int
      text: string
    dispatch: immediate
    effect: mutate
    policy: confirm
    timeout: 90s
    doc: Run the repository's entry (`<entry> manifest`) and write what it prints to abaigram.yaml, the one file never written by hand.
  - name: repo.install
    params:
      repo: string
      why: string
    result:
      ok: bool
      output: string
    dispatch: immediate
    effect: mutate
    policy: confirm
    timeout: 660s
    doc: Run npm install in the repository (network; the repository's own install scripts run; the lock file and node_modules are rewritten), so the dependencies just added resolve.
decisions: []
turns: []
