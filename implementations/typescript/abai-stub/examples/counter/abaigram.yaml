# abaigram.yaml: the manifest of counter as an abaigram (abaigrammar 0.1).
# Generated by `node counter.ts abai manifest` from the program's declarations in code.
# Do not edit by hand: `node counter.ts abai doctor` and the test suite check that this file
# agrees with the code. Regenerate with `node counter.ts abai manifest > abaigram.yaml`.

abaigrammar: "0.1"
name: counter
entry: node counter.ts abai
modes:
  - turns
  - sidecar
check:
  run: node counter.ts 5
content:
  identity: abai/identity.md
audit:
  path: ./abai-audit.log
deviations:
  - "Touchpoints are awaited promises: Node cannot block its only thread while the agent loop runs on it, so the program's logic pauses at the await while its own timers and I/O callbacks keep running (section 4.3)."
  - "Sized cell writes and event payload copies allocate: JavaScript has no copy into a preallocated byte slot; scalar rows meet section 11.2, sized rows are measured and reported."
  - "A cooperative pause holds the program at its next touchpoint, not inside safepoint(): a safepoint cannot block, since the resume arrives on the same event loop that would be blocked. The flag is still one load at a safepoint, and os pause (the launcher's signal) holds the program anywhere (section 5.5)."
  - "Under launch the child is attached as soon as its endpoint is accepted, a moment after its first statement rather than before it: Node cannot listen in a constructor. A program that wants the agent present from its first line awaits attach() (section 6.3)."
  - "In sidecar mode the region is not shared memory: cells are read by request and events cross the socket, so observation costs the program one serialization per connected harness (section 11.3). Under ABAI_HARNESS=null or exercise the null harness stays in the program's process and no endpoint opens, so a check run's measured overhead leaves that serialization out."
cells:
  - name: queue.depth
    type: int
    access: read
    doc: Number of jobs waiting. Rises when producers outpace workers.
  - name: worker.count
    type: int
    access: readwrite
    default: 4
    range:
      - 1
      - 64
    cadence: 1000
    doc: Active worker threads. The pool resizes within a batch of a change.
    policy: auto
events:
  - name: job.failed
    payload:
      job_id:
        type: string
        max: 64
      error:
        type: string
        max: 512
    wakes: always
    doc: A job exhausted its retries.
capabilities:
  - name: job.retry
    params:
      job_id: string
    result:
      ok: bool
    effect: mutate
    example:
      job_id: job-0001
    doc: Requeue a failed job once.
    dispatch: safepoint
    timeout: 30s
    policy: confirm
decisions:
  - name: on_backlog
    context:
      depth: int
      workers: int
    options:
      - scale_up
      - shed_oldest
      - wait
    default: wait
    timeout: 5s
    doc: Asked when the queue depth crosses the high-water mark.
    policy: auto
turns:
  - name: end_of_batch
    timeout: 30s
    doc: After each batch completes. The agent may tune worker.count.
