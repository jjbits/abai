# abaigram.yaml: the manifest of ornithopter as an abaigram (abaigrammar 0.1).
# Generated by `node src/main.ts abai manifest` from the program's declarations in code.
# Do not edit by hand: `node src/main.ts abai doctor` and the test suite check that this file
# agrees with the code. Regenerate with `node src/main.ts abai manifest > abaigram.yaml`.

abaigrammar: "0.1"
name: ornithopter
entry: node src/main.ts abai
modes:
  - sidecar
  - turns
check:
  run: node src/main.ts --demo
content:
  identity: abai/identity.md
  use: abai/use.md
audit:
  path: ./abai-audit.log
lifecycle:
  pause: none
  stop:
    graceful: 5s
    handler: stop
deviations:
  - "Touchpoints are awaited promises: Node cannot block its only thread while the agent loop runs on it, so the program's logic pauses at the await while its own timers and I/O callbacks keep running (section 4.3)."
  - "Sized cell writes and event payload copies allocate: JavaScript has no copy into a preallocated byte slot; scalar rows meet section 11.2, sized rows are measured and reported."
  - "A cooperative pause holds the program at its next touchpoint, not inside safepoint(): a safepoint cannot block, since the resume arrives on the same event loop that would be blocked. The flag is still one load at a safepoint, and os pause (the launcher's signal) holds the program anywhere (section 5.5)."
  - "Under launch the child is attached as soon as its endpoint is accepted, a moment after its first statement rather than before it: Node cannot listen in a constructor. A program that wants the agent present from its first line awaits attach() (section 6.3)."
  - "In sidecar mode the region is not shared memory: cells are read by request and events cross the socket, so observation costs the program one serialization per connected harness (section 11.3). Under ABAI_HARNESS=null or exercise the null harness stays in the program's process and no endpoint opens, so a check run's measured overhead leaves that serialization out."
cells:
  - name: ship.east_m
    type: float
    access: read
    doc: Position east of the pad, metres.
  - name: ship.north_m
    type: float
    access: read
    doc: Position north of the pad, metres.
  - name: ship.altitude_m
    type: float
    access: read
    doc: Altitude above sea level, metres. Dunes rise to 90 m, spire tops to about 450 m.
  - name: ship.heading_deg
    type: float
    access: read
    doc: "Compass heading: 0 north, 90 east, 180 south, 270 west."
  - name: ship.speed_mps
    type: float
    access: read
    doc: Airspeed, metres per second. Below 22 the wings stall and the ship sinks.
  - name: ship.vspeed_mps
    type: float
    access: read
    doc: Vertical speed, metres per second; negative is down.
  - name: ship.clearance_m
    type: float
    access: read
    doc: Height above the ground directly below, metres.
  - name: ship.pitch_deg
    type: float
    access: read
    doc: Nose up positive. Display only.
  - name: ship.roll_deg
    type: float
    access: read
    doc: Right wing down positive. Display only.
  - name: ground.slope_deg
    type: float
    access: read
    doc: Slope of the ground below. A landing on more than 8 degrees breaks the ship; the pad is flat.
  - name: power.pct
    type: float
    access: read
    doc: Wing power left, 0 to 100. Level flight costs a little; climbing and height cost more. At 0 the wings stop and the ship falls.
  - name: flight.phase
    type: enum
    access: read
    doc: grounded, flying, landing, landed or crashed.
    enum:
      - grounded
      - flying
      - landing
      - landed
      - crashed
  - name: flight.time_s
    type: float
    access: read
    doc: Seconds airborne this flight.
  - name: flight.crash_cause
    type: string
    access: read
    doc: "After a crash: terrain, obstacle, storm, hard_landing or collision. Empty otherwise."
    max: 32
  - name: threat.name
    type: string
    access: read
    doc: The nearest spire within 1500 m (or 20 s of flight at your speed, if farther) and 45 degrees of the heading that stands at your height. Empty when none.
    max: 32
  - name: threat.distance_m
    type: float
    access: read
    doc: Metres to the threat's surface; -1 when there is none.
  - name: threat.bearing_deg
    type: float
    access: read
    doc: "Where the threat is relative to the heading: 0 dead ahead, positive to the right, negative to the left. 0 while there is no threat."
  - name: threat.clearance_m
    type: float
    access: read
    doc: "Your altitude minus the threat's top: negative means it stands above you. Turn away from it or climb past it. 0 while there is no threat (threat.distance_m is -1)."
  - name: threat.radius_m
    type: float
    access: read
    doc: The threat's radius, metres; 0 while there is no threat.
  - name: terrain.ahead_clearance_m
    type: float
    access: read
    doc: "Your altitude minus the highest ground within 800 m along the heading (farther when fast). Below 40 the ground ahead is a danger: climb."
  - name: home.distance_m
    type: float
    access: read
    doc: Metres to the landing pad's centre; the pad's edge is 120 m from it.
  - name: home.bearing_deg
    type: float
    access: read
    doc: Where the pad is relative to the heading, -180 to 180, positive to the right.
  - name: boundary.distance_m
    type: float
    access: read
    doc: Metres to the storm wall, 2800 m from the pad. Past it the ship is lost.
  - name: obstacles.near
    type: list
    access: read
    doc: "The nearest spires within 2500 m, nearest first: name, distance to the surface, relative bearing, top altitude, radius, and your clearance above the top."
    max: 2048
    items:
      type: object
      fields:
        name: string
        distance_m: float
        bearing_deg: float
        top_m: float
        radius_m: float
        clearance_m: float
  - name: ship.callsign
    type: string
    access: read
    doc: This ship's name among the others; solo when it flies alone.
    max: 32
  - name: traffic.callsign
    type: string
    access: read
    doc: The other ship soonest to meet you, within 25 s at the present closing speed and 60 m of altitude. Empty when none.
    max: 32
  - name: traffic.distance_m
    type: float
    access: read
    doc: Metres to that ship, horizontally; -1 when there is none.
  - name: traffic.bearing_deg
    type: float
    access: read
    doc: Where that ship is relative to the heading, positive to the right. 0 while there is none.
  - name: traffic.altitude_diff_m
    type: float
    access: read
    doc: "That ship's altitude minus yours: positive means it is above you. 0 while there is none."
  - name: traffic.closing_mps
    type: float
    access: read
    doc: How fast the distance to that ship shrinks. 0 while there is none.
  - name: traffic.seconds
    type: float
    access: read
    doc: Seconds until you would meet at the present closing speed; -1 when there is none.
  - name: traffic.near
    type: list
    access: read
    doc: "The airborne ships within 2500 m, or 25 s of the worst closing speed if farther, nearest first: callsign, distance, relative bearing, altitude difference, closing speed, and seconds to meet (-1 when not closing)."
    max: 2048
    items:
      type: object
      fields:
        callsign: string
        distance_m: float
        bearing_deg: float
        altitude_diff_m: float
        closing_mps: float
        seconds: float
  - name: target.heading_deg
    type: float
    access: readwrite
    default: 0
    range:
      - 0
      - 360
    doc: The heading the autopilot holds. It turns the short way at up to 20 degrees per second, slower when fast.
    policy: auto
  - name: target.altitude_m
    type: float
    access: readwrite
    default: 180
    range:
      - 40
      - 350
    doc: "The altitude above sea level the autopilot holds: it climbs at up to 12 m/s and descends at up to 15. Height costs power, and the ceiling of 350 m is below the tallest spires: those you must turn away from."
    policy: auto
  - name: target.speed_mps
    type: float
    access: readwrite
    default: 50
    range:
      - 15
      - 90
    doc: The airspeed the autopilot holds. Faster means wider turns and less time to react; below 22 the wings stall and the ship sinks.
    policy: auto
events:
  - name: flight.takeoff
    payload:
      altitude_m: float
    wakes: never
    doc: The ship lifted off.
  - name: flight.touchdown
    payload:
      vspeed_mps: float
      slope_deg: float
      hard: bool
    wakes: always
    doc: The ship touched the ground while landing. hard means it broke.
  - name: flight.crash
    payload:
      cause:
        type: string
        max: 32
      name:
        type: string
        max: 32
      time_s: float
    wakes: always
    doc: "The flight ended: terrain, obstacle (name says which spire), storm, hard_landing, or collision (name says which ship). flight.reset puts the ship back on the pad."
  - name: threat.warning
    payload:
      name:
        type: string
        max: 32
      distance_m: float
      bearing_deg: float
      clearance_m: float
    wakes: always
    doc: A spire ahead stands at your height within 1500 m or 20 s of flight. Turn away from its bearing, or climb above its top if the ceiling allows, soon.
  - name: terrain.warning
    payload:
      clearance_m: float
    wakes: always
    doc: The ground ahead, rising or being descended into, leaves less than 40 m under you. Climb.
  - name: stall.warning
    payload:
      speed_mps: float
    wakes: always
    doc: Airspeed fell below 22 m/s; the ship sinks until it is faster.
  - name: power.low
    payload:
      pct: float
    wakes: always
    doc: Power is down to 25 percent. Head home and land.
  - name: boundary.warning
    payload:
      distance_m: float
    wakes: always
    doc: The storm wall is within 600 m or 25 s of flight. Turn back.
  - name: traffic.warning
    payload:
      callsign:
        type: string
        max: 32
      distance_m: float
      bearing_deg: float
      altitude_diff_m: float
      seconds: float
    wakes: always
    doc: Another ship is within 25 s of meeting you at the present closing speed and near your altitude. Change altitude or turn away from its bearing.
capabilities:
  - name: flight.takeoff
    params: {}
    result:
      ok: bool
      reason: string
    effect: mutate
    example: {}
    doc: Lift off from the pad, or from wherever the ship landed. It climbs for 3 seconds, then holds the targets.
    dispatch: safepoint
    timeout: 30s
    policy: confirm
  - name: flight.land
    params: {}
    result:
      ok: bool
      reason: string
    effect: mutate
    example: {}
    doc: Descend where you are at 3 m/s, slowing to a hover. A touchdown faster than 4 m/s or on ground steeper than 8 degrees breaks the ship; the pad is flat.
    dispatch: safepoint
    timeout: 30s
    policy: confirm
  - name: flight.go_around
    params: {}
    result:
      ok: bool
      reason: string
    effect: mutate
    example: {}
    doc: "Abandon the landing and climb back to the altitude target. Do it early: from a slow hover the ship sinks for a few seconds while it regains 22 m/s, so a go-around low over the ground is a crash."
    dispatch: safepoint
    timeout: 30s
    policy: confirm
  - name: flight.reset
    params: {}
    result:
      ok: bool
      reason: string
    effect: mutate
    example: {}
    doc: Put the ship back on the pad with full power, after a crash or at any time.
    dispatch: safepoint
    timeout: 30s
    policy: confirm
  - name: world.describe
    params: {}
    result:
      seed: int
      size_m: int
      boundary_radius_m: int
      pad:
        type: object
        max: 128
      spires:
        type: list
        max: 4096
    effect: read
    example: {}
    doc: "The map, in the cells' own coordinates: the pad (east, north, radius, height), every spire (east, north, radius, top) and the wall's radius. Read it before you plan a route."
    dispatch: safepoint
    timeout: 30s
    policy: auto
decisions: []
turns: []
